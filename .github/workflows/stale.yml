name: Stale

# K-58: chỉ gắn nhãn `stale` cho PR/issue không hoạt động 14 ngày; KHÔNG tự đóng
# (`days-before-close: -1`) — quyết định đóng hay gộp là của người.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      # actions/stale v11.0.0, ghim theo SHA commit.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
        with:
          days-before-stale: 14
          days-before-close: -1
          stale-pr-label: stale
          stale-issue-label: stale
          stale-pr-message: 'PR này không có hoạt động 14 ngày nên được gắn nhãn `stale`. Hãy rebase và gộp, hoặc đóng, hoặc chuyển thành mục việc.'
          stale-issue-message: 'Mục này không có hoạt động 14 ngày nên được gắn nhãn `stale`.'
          operations-per-run: 60
