name: CI

on:
  # `master` là nhánh chính thật của repo này. Trước đây chỉ khai `main`, nên
  # không job nào từng chạy — CI xanh vì không có CI, không phải vì mã đúng.
  # Giữ cả hai để lần đổi tên nhánh (nếu có) không lại làm tắt CI lần nữa.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Chạy tay trên nhánh chưa mở PR (`gh workflow run ci.yml --ref <nhánh>`).
  workflow_dispatch: {}

# L8-N05: token chỉ đọc cho mọi job (không job nào ghi vào repo; artifact do upload-artifact đi qua dịch vụ riêng).
# Mọi `uses:` ghim SHA commit của bản v4 mới nhất, chú thích thẻ ở cuối dòng; Dependabot (hệ github-actions) cập nhật cả hai.
permissions:
  contents: read

# Một lượt mới trên cùng nhánh/PR huỷ lượt cũ đang chạy — chỉ với PR. Lượt cũ chỉ
# còn chiếm runner: hạn mức job chạy cùng lúc là của cả tài khoản, dùng chung với
# AppBack (~15 job mỗi lượt), nên một lượt thừa kéo dài hàng đợi của mọi lượt khác.
# Push lên `master` thì không huỷ: mỗi commit đã merge cần phán quyết riêng.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Bốn cổng, đúng các bước của `pnpm verify`. Job e2e `visual` đã bỏ (02/11/2026): bộ e2e là test
# của từng đợt làm việc, chạy tại máy bằng `pnpm e2e`, không phải cổng merge. Ngoại lệ là hai job e2e nhỏ:
# `e2e-stability` (hai spec Pascal) và `e2e-smoke` (K-53: vỏ app + bảng route + luồng F1 tải → duyệt → xuất;
# xem khối chú thích trên job đó). `test-pascal` (bun test bốn gói vendor) chạy để HIỆN đỏ/xanh, `continue-on-error`,
# chưa phải cổng.
#
# KHÔNG cổng nào `needs:` cổng nào. Đây là lựa chọn, không phải thiếu sót.
#
# Trước đây chúng nối thành một chuỗi: typecheck ← lint, unit ← typecheck,
# build ← unit, visual ← build. Chuỗi ấy cho mỗi lượt chạy đúng MỘT phán quyết —
# mắt xích hỏng đầu tiên — rồi bốn job sau bị `skipped`, tức không biết chúng
# xanh hay đỏ. Lần gần nhất `lint` không khởi động được (tài khoản bị khoá thanh
# toán), cả bốn job sau im lặng suốt 25 ngày và 63 lượt chạy; bảng CI không hề
# đỏ, nó chỉ rỗng. Cùng hình dạng với cái bẫy `main`/`master` ghi ở trên: CI xanh
# vì không có CI.
#
# Chuỗi đó cũng không mô tả quan hệ thật. `lint` không phải điều kiện kỹ thuật
# của `typecheck`: hai bên đọc cùng mã nguồn, không bên nào ăn đầu ra của bên
# kia. Một cảnh báo lint không làm câu trả lời của `tsc` kém tin cậy đi — nó chỉ
# làm ta không được nghe câu trả lời đó.
#
# `needs:` duy nhất là BÊN TRONG cổng `unit`: job `unit` gộp kết quả của các mảnh
# `unit-shard` (xem ở đó). Nó không nối hai cổng với nhau — mảnh nào đỏ thì `unit`
# vẫn chạy (`!cancelled()`) và nói ra bài nào đỏ.
#
# Giá phải trả: không đồng nào. Mỗi job vốn đã tự `checkout` + `pnpm install`
# riêng (~15 s), nên số phút máy gần như không đổi — chỉ khác là chúng chạy cùng
# lúc thay vì xếp hàng. Đổi lại, một lượt chạy cho bốn phán quyết, và khi có ba thứ
# hỏng thì ta thấy cả ba trong một lần đọc chứ không phải sửa-chạy-lại bốn vòng.
#
# Mọi job có `timeout-minutes` (bình thường mỗi job 2–4 phút). Trước đây không có:
# job e2e cũ từng chạy 1 giờ 55 phút (02/11/2026), giữ runner suốt thời gian đó
# trong khi hạn mức chung với AppBack bắt các job khác xếp hàng.
#
# `ubuntu-24.04` chứ không `ubuntu-latest`: nhãn đó chuyển sang Ubuntu 26 từ 19/10/2026; ghim để
# môi trường không đổi ngầm giữa hai lượt chạy.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `import/no-cycle` không nằm trong `pnpm lint` vì nó phải dựng đồ thị phụ
      # thuộc của hơn 500 file và làm chậm vòng lặp sửa-lint lúc phát triển.
      # Chỗ của nó là đây và trong `pnpm verify` (R-05).
      - run: pnpm cycles
      # Bước `độ dài file` của `pnpm verify`; thiếu ở đây thì CI xanh vẫn chưa bằng cổng.
      - run: pnpm length

  typecheck:
    runs-on: ubuntu-24.04
    # Trần heap tường minh: mặc định Node chỉ ~2 GB trên runner, OOM build 13/11, typecheck 17/11 (L8-N04).
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node -e "const v=require('v8');console.log('heap_size_limit_MB='+Math.round(v.getHeapStatistics().heap_size_limit/2**20))"
      - run: pnpm typecheck

  # `coverage` chứ không phải `test`: cùng một lượt vitest, nhưng có đối chiếu
  # ngưỡng độ phủ (domain 90% / lib 80%). `pnpm test` chạy đúng bộ test đó mà bỏ
  # qua ngưỡng, nên ngưỡng sẽ chỉ là số nằm trong file config.
  #
  # Một lượt `pnpm coverage` trọn bộ mất ~7,5 phút trên runner 4 lõi (714 tệp,
  # 02/11/2026), nên nó được chia làm bốn mảnh chạy song song, rồi gộp lại. Đó vẫn
  # là ĐÚNG lệnh `vitest run --coverage` với cùng config — chỉ khác chỗ chạy:
  #
  # - Mỗi mảnh (`--shard=i/4 --reporter=blob`) ghi kết quả bài + độ phủ thô ra
  #   `.vitest-reports/`. `COVERAGE_SHARD=1` tắt đối chiếu ngưỡng TRONG MẢNH
  #   (`vitest.config.ts`): một mảnh chỉ chạy một phần bài nên độ phủ riêng của nó
  #   luôn thấp hơn thật. `all: true` vẫn bật trong mảnh, nên tệp không bài nào
  #   chạm tới vẫn vào mẫu số với 0%.
  # - Job `unit` gộp mọi mảnh bằng `vitest run --merge-reports --coverage`, không
  #   có `COVERAGE_SHARD`, nên ngưỡng được đối chiếu trên độ phủ của CẢ bộ. Bài đỏ ở
  #   bất kỳ mảnh nào cũng làm `unit` đỏ.
  #
  # Số gộp KHÔNG trùng từng chữ số với một lượt chạy liền. Đối chiếu trên CI
  # (02/11/2026, lượt 41479385093 liền với lượt 41481345751 gộp): trong `src/domain`
  # và `src/lib` — hai tầng có ngưỡng — câu lệnh/dòng/hàm trùng khớp từng thư mục,
  # còn NHÁNH lệch tới vài điểm, đa số lệch lên (`src/lib/telemetry` 85,57 → 90,16):
  # v8 gộp các mảnh ở mức istanbul chứ không ở mức khối v8 như trong một tiến trình,
  # nên một nhánh chạy ở hai mảnh được đếm khác. Ngoài hai tầng ấy (components…) số
  # câu lệnh còn lệch mạnh hơn. Ngưỡng nhánh vì thế hơi dễ hơn lượt chạy liền; cần
  # đúng từng chữ số thì `pnpm coverage` tại máy vẫn là thước chuẩn.
  unit-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob --coverage.reporter=text-summary
        env:
          COVERAGE_SHARD: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  unit:
    needs: unit-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      # Thiếu blob của một mảnh (mảnh chết trước khi ghi) thì gộp ba mảnh vẫn có thể
      # qua ngưỡng nhờ mẫu số nhỏ hơn — nên đếm đủ bốn trước khi tin con số.
      - run: test "$(ls .vitest-reports/blob-*-4.json | wc -l)" -eq 4
      - run: pnpm exec vitest run --merge-reports --coverage

  build:
    runs-on: ubuntu-24.04
    # Trần heap tường minh: mặc định Node chỉ ~2 GB trên runner, OOM build 13/11, typecheck 17/11 (L8-N04).
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node -e "const v=require('v8');console.log('heap_size_limit_MB='+Math.round(v.getHeapStatistics().heap_size_limit/2**20))"
      - run: pnpm build
      # Ngân sách gzip, đọc từ `dist/` mà bước trên vừa dựng.
      - run: pnpm size

  # Độ ổn định trang 3D Pascal (thư viện/concept về chậm, lỗi, đổi tầng, không ghi ngoài ý muốn) bằng máy chủ giả.
  # Bắt buộc như các cổng khác. KHÔNG đặt `E2E_SKIP_PASCAL`: biến đó bỏ lượt dựng vách ngăn Pascal
  # (`public/assets/pascal`), mà `/editor3d.html` cần nó. `scripts/run-playwright.mjs` tự dựng vách ngăn + Vite.
  #
  # `playwright.config.ts` đặt `channel: 'chrome'` (Chrome thật), nên cài `chrome` chứ không `chromium`; cờ GPU không
  # đặt thêm: trang dùng WebGPURenderer có dự phòng WebGL2, headless Linux chạy SwiftShader (không có GPU/WebGPU thật).
  # `--retries=1` (config mặc định 2 retry × test 8 phút vượt hạn job); hạn 25 phút, upload chạy cả khi job đỏ.
  e2e-stability:
    runs-on: ubuntu-24.04
    # Trần heap tường minh: mặc định Node chỉ ~2 GB trên runner, OOM build 13/11, typecheck 17/11 (L8-N04).
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node -e "const v=require('v8');console.log('heap_size_limit_MB='+Math.round(v.getHeapStatistics().heap_size_limit/2**20))"
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm e2e e2e/pascal-stability.spec.ts e2e/pascal-edit-path.spec.ts --workers=1 --retries=1
        env:
          E2E_PORT: '5191'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  # K-53: cổng e2e nhỏ cho luồng F1 (tải bản vẽ → duyệt → xuất), trên máy chủ giả như `e2e-stability`.
  # Spec: `smoke.spec.ts` (vỏ app) · `smoke-grid.spec.ts` (bảng route: mọi màn mở được, không trắng, không lỗi
  # console) · `v4v5/upload.spec.ts` (tải) · `v4v5/quality.spec.ts` (duyệt chất lượng) · `v12a/export.spec.ts` (xuất).
  # Chạy đủ mọi bài của năm spec, không `--grep-invert`: 4 bài từng bị loại tạm (smoke-grid `projectScale`/`projectRooms`,
  # upload `U03:`, export `.glb`) là bài lỗi thời sau đổi giao diện/luồng, đã sửa ở nhánh fix/e2e-* (K-53).
  # Bài đỏ thì sửa, không loại khỏi lệnh và không dùng `.skip` trong spec (R-46).
  # Đo tại máy (22/11/2026, 52 bài, 2 worker, retries=1, fail-on-flaky): 4/4 lượt ấm xanh, 61-66 s mỗi lượt (lượt đầu
  # lạnh đỏ 2 bài login vì máy chủ dev chưa ấm; `run-playwright.mjs` có bước làm ấm nên CI không gặp).
  # Đo lại sau khi bỏ `--grep-invert` (22/11/2026, 56 bài, 2 worker, retries=0, gộp ba nhánh fix/e2e-*): 3 lượt liên tiếp
  # xanh 56/56, ~50 s chạy bài; một lượt trước đó đỏ 1 bài vì WebSocket HMR `ERR_NO_BUFFER_SPACE` (máy hết socket, hạ tầng).
  # Chưa là check bắt buộc (K-52): chờ 7 ngày xanh liên tiếp trên master.
  e2e-smoke:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm e2e e2e/smoke.spec.ts e2e/smoke-grid.spec.ts e2e/v4v5/upload.spec.ts e2e/v4v5/quality.spec.ts e2e/v12a/export.spec.ts --workers=2 --retries=1
        env:
          E2E_PORT: '5192'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  # K-53: `bun test` bốn gói vendor Pascal (core, viewer, nodes, editor). `pnpm verify` không gọi script này.
  # `continue-on-error: true`: chỉ để thấy đỏ/xanh trên mỗi lượt, KHÔNG chặn (chưa biết bốn gói có xanh không — nếu
  # đỏ liên tục thì sửa hoặc bỏ, đừng để thành tín hiệu bị lờ). `oven-sh/setup-bun` ghim SHA (v2.2.0).
  test-pascal:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pascal
